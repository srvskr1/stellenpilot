# Start the dashboard:   docker compose up -d     then open http://127.0.0.1:8765
# One time setup:        docker compose run --rm stellenpilot init
# A search run:          docker compose run --rm stellenpilot run
services:
  stellenpilot:
    # Uses the published image when available, otherwise builds it from this folder.
    image: ghcr.io/srvskr1/stellenpilot:latest
    build: .
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8765:8765"   # only reachable from this computer
    restart: unless-stopped
    # Using a local model (Ollama, LM Studio) on this computer? Uncomment both blocks
    # and set llm.provider in data/config.toml. See docs/local-llm.md.
    # environment:
    #   JOBHUNT_LLM_BASE_URL: "http://host.docker.internal:11434"   # Ollama; LM Studio: http://host.docker.internal:1234/v1
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"                       # needed on Linux

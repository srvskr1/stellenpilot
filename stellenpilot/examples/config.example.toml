# Copy this file to config.toml and edit it. config.toml is ignored by git.
# Secrets (API keys) go in environment variables or a .env file, never in this file.

[search]
# Job titles to look for. Each source turns these into its own query format.
keywords = ["Werkstudent Data", "Working Student Data", "Junior Data Engineer", "Junior Data Analyst"]
# Home base for on site and hybrid roles.
city = "Essen"
radius_km = 75
# Extra place names that count as "near home" for sources that only give a city name (Arbeitnow).
nearby_cities = ["Dortmund", "Bochum", "Duisburg", "Düsseldorf", "Köln", "Gelsenkirchen", "Oberhausen", "Mülheim", "Wuppertal", "Hagen", "Bonn", "Leverkusen", "Münster"]
# Two letter country code. Bundesagentur and Arbeitnow cover Germany only; Adzuna covers
# gb us at au be br ca ch de es fr in it mx nl nz pl sg za; TheirStack and the watchlist cover any country.
country = "de"
# Also look for remote roles anywhere in the country.
include_remote = true
# Only ads published in the last N days.
max_age_days = 3
# Drop ads whose title contains any of these words (case insensitive).
exclude_title_words = ["senior", "lead", "head of", "principal", "sales", "ausbildung"]
# The same company and job title seen again after this many days counts as a new posting
# (companies repost Werkstudent roles every semester). 0 means never show a repeated title again.
repost_after_days = 45

[language]
# Your German level, A1 to C2. Leave empty to read it from profile.toml ("German (A2)").
my_german_level = ""
# Ads that ask for more than your level plus this many steps are marked "German needed"
# and skipped (still visible on the board). With A2 and 1, B1 ads are kept, B2 and above skipped.
german_tolerance = 1
skip_if_german_too_high = true

[sources]
arbeitsagentur = true   # Bundesagentur fuer Arbeit, free, no key
arbeitnow = true        # free, no key, link back required (the dashboard shows it)
adzuna = false          # needs ADZUNA_APP_ID and ADZUNA_APP_KEY
theirstack = false      # needs THEIRSTACK_API_KEY, 200 free credits a month
jobicy = true           # free, no key, remote jobs only (used when include_remote = true)
remotive = true         # free, no key, remote jobs only, one call a run, small feed

[sources.limits]
# Hard caps per run, to stay inside free plans and to be polite to free APIs.
adzuna_calls = 20            # Adzuna free plan: 250 a day, 2500 a month
adzuna_pages = 5             # pages per search, 50 jobs each
arbeitsagentur_results = 150 # each kept job costs one extra request for the full ad
arbeitsagentur_pages = 5     # pages per search, 50 jobs each
arbeitnow_pages = 10         # 325 jobs per page; stops early at max_age_days
jobicy_pages = 2             # pages per region, 200 jobs each
theirstack_jobs = 6          # 1 credit per job, 200 credits a month

[sources.theirstack_options]
# Location ids from TheirStack's location catalog. 2861876 is North Rhine-Westphalia.
# Leave empty to search the whole country.
location_ids = [2861876]
# Keep only ads written in English (saves credits if you only apply in English).
english_only = true

[watch]
# Companies whose own job feeds are checked every run. Find the entry for a company with:
#   stellenpilot watch https://job-boards.greenhouse.io/trivago
# Supported: greenhouse, lever, ashby, personio, smartrecruiters
companies = []
# Also check a ready list of about 200 companies with offices in Germany, each verified to have
# a working job feed (see examples/watchlist_germany.txt in the package). Germany only.
starter_list = false
# Keep only titles containing one of these words. Empty: taken from search.keywords.
title_words = []
# Ignore postings older than this many days.
max_age_days = 30

[llm]
# provider:
#   "none"       keyword scoring and template letters, no AI
#   "builtin"    Stellenpilot's own AI: downloaded once from the dashboard (Settings, AI model), runs on
#                this computer, no account or key. model = "standard" (Qwen3.5 4B) or "light" (Qwen3.5 2B)
#   "ollama"     local model through Ollama (default http://localhost:11434)
#   "lmstudio"   local model through LM Studio's server (default http://localhost:1234/v1)
#   "llamacpp"   llama.cpp server (default http://localhost:8080/v1)
#   "vllm"       vLLM server (default http://localhost:8000/v1)
#   "local"      any other OpenAI compatible server, set base_url
#   "anthropic"  Claude, needs ANTHROPIC_API_KEY
#   "openai"     OpenAI, needs OPENAI_API_KEY
# See docs/local-llm.md for setting up a local model.
provider = "none"
# Model name as your server knows it, e.g. "qwen3.5:4b" or "ministral-3:8b" for Ollama,
# "claude-haiku-4-5-20251001" (cheap) or "claude-sonnet-5-5" (best letters) for Anthropic.
model = ""
# Leave empty to use the default for the provider.
base_url = ""
# Optional tuning, mostly for local models:
# timeout = 600          # seconds per answer (local default 600, cloud 120)
# num_ctx = 8192         # Ollama context window in tokens
# max_input_chars = 4000 # longer job ads are cut to this many characters (local default 4000)
# json_mode = true       # ask the server for strict JSON; turned off automatically if unsupported
# temperature = 0.2
# think = false         # Qwen3.5 and Gemma 4 can reason before answering; slower, rarely needed here
# max_ai_jobs = 20       # AIs on your own computer read only this many new jobs per search (the most
#                        # promising by keywords); the rest keep a keyword score. 0 = all. Cloud: all.

[tailor]
# Jobs at or above this match get a tailored CV and cover letter.
min_match = 70
max_per_run = 5
output_dir = "output"
# Convert DOCX to PDF with LibreOffice when it is installed.
make_pdf = true
# Only tailor for ads written in English. Set false if you also apply in German.
only_english_ads = true
# Cover letter language: "auto", "en" or "de".
# "auto" writes German for German ads only if your German is B2 or better (and an LLM is set).
# Below B2 it writes English: a polished German letter would suggest a level you do not have.
letter_language = "auto"

[notify]
# A short digest to yourself after each run. Secrets go in .env, see docs/digest.md.
email = false
telegram = false
# Skip the digest on days with no new jobs and no Gmail changes.
only_when_new = false

[gmail]
# Optional. See docs/gmail.md. Reads mail only, never sends.
enabled = false
lookback_days = 3

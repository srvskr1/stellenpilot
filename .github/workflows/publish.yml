# Publishes to PyPI when the version in pyproject.toml is new (not on PyPI yet).
# Runs on every push to main that touches pyproject.toml, and from the Actions tab ("Run workflow").
# Uses PyPI trusted publishing: no password or token is stored anywhere (see RELEASING.md).
name: publish to PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: check
        name: is this version new on PyPI?
        run: |
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/stellenpilot/$v/json")
          if [ "$code" = "404" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; echo "Version $v is already on PyPI, nothing to do."; fi
      - if: steps.check.outputs.new == 'true'
        run: python -m pip install build twine && python -m build && python -m twine check dist/*
      - if: steps.check.outputs.new == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
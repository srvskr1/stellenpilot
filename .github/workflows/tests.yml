name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Smoke test of the commands
        shell: bash
        run: |
          mkdir smoke && cd smoke
          jobhunt init
          jobhunt demo
          jobhunt doctor
          jobhunt --help

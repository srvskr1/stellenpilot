name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests (offline)
        run: python -m unittest discover -s tests -v
      - name: Smoke test of the commands
        shell: bash
        run: |
          mkdir smoke && cd smoke
          stellenpilot init
          stellenpilot demo
          stellenpilot doctor
          stellenpilot --help

  audit:
    # Fails when an installed dependency has a known vulnerability (see the security audit, S2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install with every optional extra
        run: python -m pip install ".[gmail]" pip-audit
      - name: Check dependencies for known vulnerabilities
        run: pip-audit --skip-editable

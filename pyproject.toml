[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stellenpilot"
version = "0.12.3"
description = "Local job search assistant for Germany: finds jobs daily, scores them against your CV, and writes truthful tailored CVs and cover letters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sourav Sarker" }]
requires-python = ">=3.11"
dependencies = ["python-docx>=1.1", "pypdf>=6.19", "truststore>=0.10"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
keywords = ["job search", "cv", "resume", "germany", "werkstudent", "llm", "ollama"]

[project.urls]
Homepage = "https://github.com/srvskr1/stellenpilot"
Issues = "https://github.com/srvskr1/stellenpilot/issues"
Documentation = "https://github.com/srvskr1/stellenpilot/blob/main/INSTALL.md"

[project.optional-dependencies]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[project.scripts]
stellenpilot = "stellenpilot.cli:main"

[tool.setuptools.packages.find]
include = ["stellenpilot*"]

[tool.setuptools.package-data]
stellenpilot = ["web/*", "web/fonts/*", "examples/*"]

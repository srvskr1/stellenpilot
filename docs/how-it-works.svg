<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 960 210" width="960" height="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How Stellenpilot works: collect, score, write, track, then you decide">
<style>
.bg{fill:#F8FAFC}.tr{stroke:#E4E7EC}.fill{stroke:#1D4ED8}.dot{fill:#1D4ED8}.last{fill:#fff;stroke:#1D4ED8}.ic{stroke:#fff}.ic5{stroke:#1D4ED8}
.h{fill:#101828;font-weight:700;font-size:17px}.s{fill:#475467;font-size:13.5px}.n{fill:#1D4ED8;font-weight:700;font-size:12px;letter-spacing:.08em}
@media (prefers-color-scheme:dark){.bg{fill:#0D1117}.tr{stroke:#30363D}.fill{stroke:#3B6FE0}.dot{fill:#3B6FE0}.last{fill:#0D1117;stroke:#4C8DFF}.ic5{stroke:#4C8DFF}.h{fill:#E6EDF3}.s{fill:#9BA6B2}.n{fill:#4C8DFF}}
</style>
<rect class="bg" y="70" width="960" height="210" rx="16"/>
<defs><pattern id="st" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="16" fill="#fff" opacity=".22"/></pattern></defs>
<line class="tr" x1="96" y1="150" x2="864" y2="150" stroke-width="8" stroke-linecap="round"/>
<line class="fill" x1="96" y1="150" x2="864" y2="150" stroke-width="8" stroke-linecap="round"/>
<rect x="96" y="146" width="768" height="8" fill="url(#st)" rx="4"/>
<text class="n" x="96" y="112" text-anchor="middle">STEP 1</text>
<circle class="dot" cx="96" cy="150" r="24" stroke-width="3"/>
<g class="ic" transform="translate(84 138)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>
<text class="h" x="96" y="206" text-anchor="middle">Collect</text><text class="s" x="96" y="230" text-anchor="middle">7 job boards and</text><text class="s" x="96" y="249" text-anchor="middle">200 company sites at once</text>
<text class="n" x="288" y="112" text-anchor="middle">STEP 2</text>
<circle class="dot" cx="288" cy="150" r="24" stroke-width="3"/>
<g class="ic" transform="translate(276 138)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g>
<text class="h" x="288" y="206" text-anchor="middle">Score</text><text class="s" x="288" y="230" text-anchor="middle">every job 0 to 100</text><text class="s" x="288" y="249" text-anchor="middle">with reasons and gaps</text>
<text class="n" x="480" y="112" text-anchor="middle">STEP 3</text>
<circle class="dot" cx="480" cy="150" r="24" stroke-width="3"/>
<g class="ic" transform="translate(468 138)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></g>
<text class="h" x="480" y="206" text-anchor="middle">Write</text><text class="s" x="480" y="230" text-anchor="middle">a CV and cover letter</text><text class="s" x="480" y="249" text-anchor="middle">for the best matches</text>
<text class="n" x="672" y="112" text-anchor="middle">STEP 4</text>
<circle class="dot" cx="672" cy="150" r="24" stroke-width="3"/>
<g class="ic" transform="translate(660 138)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g>
<text class="h" x="672" y="206" text-anchor="middle">Track</text><text class="s" x="672" y="230" text-anchor="middle">Gmail moves your</text><text class="s" x="672" y="249" text-anchor="middle">applications forward</text>
<text class="n" x="864" y="112" text-anchor="middle">YOU</text>
<circle class="last" cx="864" cy="150" r="24" stroke-width="3"/>
<g class="ic5" transform="translate(852 138)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></g>
<text class="h" x="864" y="206" text-anchor="middle">You decide</text><text class="s" x="864" y="230" text-anchor="middle">read, edit and</text><text class="s" x="864" y="249" text-anchor="middle">send it yourself</text>
</svg>
